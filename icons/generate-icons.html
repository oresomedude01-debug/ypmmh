<!DOCTYPE html>
<html>

<head>
    <title>YPMMH PWA Icon Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            padding: 30px;
            background: #f1f5f9;
        }

        h1 {
            color: #0B4D73;
        }

        .icons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .icon-item {
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .icon-item canvas {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .icon-item p {
            margin: 8px 0 0;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        a {
            display: inline-block;
            margin-top: 6px;
            color: #0B4D73;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <h1>🎨 YPMMH PWA Icon Generator</h1>
    <p>Right-click each icon → "Save image as..." → save to <code>/public/icons/</code></p>
    <div class="icons" id="icons"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const container = document.getElementById('icons');

        function drawIcon(canvas, size, maskable = false) {
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            // Background
            ctx.fillStyle = '#0B4D73';
            ctx.fillRect(0, 0, size, size);

            // If maskable, add extra padding (safe zone is center 80%)
            const padding = maskable ? size * 0.1 : size * 0.15;
            const innerSize = size - (padding * 2);

            // Draw decorative circle
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, innerSize * 0.38, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fill();

            // Draw crescent (Islamic motif)
            const cx = size / 2;
            const cy = size / 2 - innerSize * 0.05;
            const r = innerSize * 0.25;

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#D4AF37';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx + r * 0.3, cy - r * 0.1, r * 0.85, 0, Math.PI * 2);
            ctx.fillStyle = '#0B4D73';
            ctx.fill();

            // Star
            drawStar(ctx, cx + r * 0.45, cy - r * 0.15, 5, r * 0.12, r * 0.06, '#D4AF37');

            // Text "YPMMH"
            const fontSize = innerSize * 0.14;
            ctx.font = `800 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'white';
            ctx.fillText('YPMMH', cx, cy + r + fontSize * 1.1);

            // Subtitle
            const subSize = fontSize * 0.35;
            ctx.font = `600 ${subSize}px 'Segoe UI', Arial, sans-serif`;
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.fillText('MENTORING HUB', cx, cy + r + fontSize * 1.1 + subSize * 2.2);
        }

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                rot += step;
                ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        // Generate standard icons
        sizes.forEach(size => {
            const item = document.createElement('div');
            item.className = 'icon-item';
            const canvas = document.createElement('canvas');
            drawIcon(canvas, size, false);
            item.appendChild(canvas);
            item.innerHTML += `<p>icon-${size}x${size}.png</p>`;
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `icon-${size}x${size}.png`;
            link.textContent = '⬇ Download';
            item.appendChild(link);
            container.appendChild(item);
        });

        // Generate maskable icons
        [192, 512].forEach(size => {
            const item = document.createElement('div');
            item.className = 'icon-item';
            const canvas = document.createElement('canvas');
            drawIcon(canvas, size, true);
            item.appendChild(canvas);
            item.innerHTML += `<p>icon-maskable-${size}x${size}.png</p>`;
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = `icon-maskable-${size}x${size}.png`;
            link.textContent = '⬇ Download (Maskable)';
            item.appendChild(link);
            container.appendChild(item);
        });
    </script>
</body>

</html>
